name: Auto-Media CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_e2e:
        description: "Run real provider sandbox publishing"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: automedia
          POSTGRES_PASSWORD: "ci p@ss/w:rd"
          POSTGRES_DB: automedia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automedia -d automedia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      POSTGRES_USER: automedia
      POSTGRES_PASSWORD: "ci p@ss/w:rd"
      POSTGRES_DB: automedia
      CREDENTIALS_MASTER_KEY: ci-test-master-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Validate Docker Compose
        run: CREDENTIALS_MASTER_KEY=ci-test POSTGRES_PASSWORD=ci-test docker compose --profile n8n --profile backup config >/tmp/compose-config.yml
      - name: Validate backup restore script
        run: sh -n scripts/verify-backup-restore.sh
      - name: Core self-tests and unit tests
        run: npm test
      - name: Apply database migrations
        run: npm run db:migrate
      - name: SQL schema audit (every static query vs the migrated schema)
        env:
          SQL_AUDIT_STRICT: "true"
        run: npm run test:sql
      - name: Publishing and content integration tests
        run: npm run test:integration
      - name: Native content engine integration test
        env:
          ENGINE_TEST_STRICT: "true"
        run: npm run test:engine
      - name: Boot smoke test (starts the real server)
        run: npm run test:boot
      - name: Provider sandbox suite
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          CREDENTIALS_MASTER_KEY: ${{ secrets.E2E_CREDENTIALS_MASTER_KEY || 'ci-test-master-key' }}
          PUBLIC_BASE_URL: ${{ secrets.E2E_PUBLIC_BASE_URL }}
          AUTOMEDIA_E2E_ACCOUNT_IDS: ${{ secrets.E2E_ACCOUNT_IDS }}
          AUTOMEDIA_E2E_PUBLISH: "false"
          AUTOMEDIA_E2E_STRICT: "false"
        run: npm run test:provider-sandbox

      - name: Publisher adapter contract
        run: node server/publisherContractTest.mjs
      - name: Check server modules
        run: |
          node --check server/index.mjs
          node --check server/run.mjs
          node --check server/db.mjs
          node --check server/db/migrate.mjs
          node --check server/studioRoutes.mjs
          node --check server/ai.mjs
          node --check server/rss.mjs
          node --check server/contentEngine.mjs
          node --check server/n8nService.mjs
          node --check server/nativeScheduler.mjs
          node --check server/generationScheduler.mjs
          node --check server/accountHealth.mjs
          node --check server/calendar.mjs
          node --check server/studioAuth.mjs
          node --check server/oauth.mjs
          node --check server/postEngagement.mjs
          node --check server/maintenanceScheduler.mjs
          node --check server/engagement.mjs
          node --check server/engagementScheduler.mjs
          node --check server/postPerformanceScheduler.mjs
          node --check server/blueskyOAuth.mjs
          node --check server/bluesky.mjs
          node --check server/structuredValidation.mjs
          node --check server/runtimeConfig.mjs
          node --check server/rateLimit.mjs
          node --check server/db/migrate.mjs
          node --check server/platformCapabilities.mjs
          node --check server/storage.mjs
          node --check server/studioPublishing.mjs
          node --check server/publishingScheduler.mjs
          node --check server/mastodon.mjs
          node --check server/xOAuth2.mjs
          node --check server/publisherContractTest.mjs
          node --check server/integrationTest.mjs
          node --check server/branding.mjs
          node --check server/contentPolicy.mjs
          node --check server/metrics.mjs
          node --check server/securityHeaders.mjs
          node --check server/unitTests.mjs
          node --check server/engineIntegrationTest.mjs
          node --check server/bootSmokeTest.mjs
          node --check server/sqlSchemaAudit.mjs
          node --check server/platformFormatter.mjs
          node --check server/platformFormatterTest.mjs
          node --check server/contentQuality.mjs
          node --check server/contentQualityTest.mjs
          node --check server/variants.mjs
          node --check server/aiFailover.mjs
          node --check server/promptSafety.mjs
          node --check server/aiResilienceTest.mjs
          node --check server/circuitBreaker.mjs
          node --check server/smartSchedule.mjs
          node --check server/resilienceTest.mjs

  provider-sandbox-publish:
    if: vars.AUTOMEDIA_E2E_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_e2e == true)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Real provider sandbox publish
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          CREDENTIALS_MASTER_KEY: ${{ secrets.E2E_CREDENTIALS_MASTER_KEY }}
          PUBLIC_BASE_URL: ${{ secrets.E2E_PUBLIC_BASE_URL }}
          AUTOMEDIA_E2E_ACCOUNT_IDS: ${{ secrets.E2E_ACCOUNT_IDS }}
          AUTOMEDIA_E2E_PUBLISH: "true"
          AUTOMEDIA_E2E_STRICT: "true"
        run: npm run test:provider-sandbox

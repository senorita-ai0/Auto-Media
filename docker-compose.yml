services:
  automedia:
    build: .
    container_name: automedia
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://automedia:automedia@postgres:5432/automedia
      N8N_ENABLED: "false"
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_BASE_URL: http://n8n:5678
      N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS:-30000}
      N8N_WEBHOOK_PREFIX: ${N8N_WEBHOOK_PREFIX:-webhook}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_IMAGE_BASE_URL: ${AI_IMAGE_BASE_URL:-}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-auto}
      AI_IMAGE_SIZE: ${AI_IMAGE_SIZE:-1024x1024}
      AI_IMAGE_TIMEOUT_MS: ${AI_IMAGE_TIMEOUT_MS:-120000}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_JSON_MODE: ${AI_JSON_MODE:-true}
      TECH_RSS_FEEDS: ${TECH_RSS_FEEDS:-}
      MEDIA_ROOT: /app/media
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      STUDIO_AUTH_REQUIRED: ${STUDIO_AUTH_REQUIRED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:?Set CREDENTIALS_MASTER_KEY in .env}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_SCOPES: "${GOOGLE_OAUTH_SCOPES:-https://www.googleapis.com/auth/youtube.upload}"
      LINKEDIN_OAUTH_CLIENT_ID: ${LINKEDIN_OAUTH_CLIENT_ID:-}
      LINKEDIN_OAUTH_CLIENT_SECRET: ${LINKEDIN_OAUTH_CLIENT_SECRET:-}
      LINKEDIN_OAUTH_SCOPES: "${LINKEDIN_OAUTH_SCOPES:-openid profile w_member_social}"
      TIKTOK_OAUTH_CLIENT_KEY: ${TIKTOK_OAUTH_CLIENT_KEY:-}
      TIKTOK_OAUTH_CLIENT_SECRET: ${TIKTOK_OAUTH_CLIENT_SECRET:-}
      TIKTOK_OAUTH_SCOPES: "${TIKTOK_OAUTH_SCOPES:-user.info.basic video.publish}"
      META_OAUTH_APP_ID: ${META_OAUTH_APP_ID:-}
      META_OAUTH_APP_SECRET: ${META_OAUTH_APP_SECRET:-}
      META_OAUTH_SCOPES: ${META_OAUTH_SCOPES:-pages_show_list,pages_read_engagement,pages_manage_posts}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
      X_OAUTH_CLIENT_ID: ${X_OAUTH_CLIENT_ID:-}
      X_OAUTH_CLIENT_SECRET: ${X_OAUTH_CLIENT_SECRET:-}
      X_OAUTH_SCOPES: "${X_OAUTH_SCOPES:-tweet.read tweet.write users.read offline.access media.write}"
      THREADS_OAUTH_APP_ID: ${THREADS_OAUTH_APP_ID:-}
      THREADS_OAUTH_APP_SECRET: ${THREADS_OAUTH_APP_SECRET:-}
      THREADS_OAUTH_SCOPES: "${THREADS_OAUTH_SCOPES:-threads_basic threads_content_publish}"
      PINTEREST_OAUTH_APP_ID: ${PINTEREST_OAUTH_APP_ID:-}
      REDDIT_OAUTH_CLIENT_ID: ${REDDIT_OAUTH_CLIENT_ID:-}
      REDDIT_OAUTH_CLIENT_SECRET: ${REDDIT_OAUTH_CLIENT_SECRET:-}
      PINTEREST_OAUTH_APP_SECRET: ${PINTEREST_OAUTH_APP_SECRET:-}
      PINTEREST_OAUTH_SCOPES: ${PINTEREST_OAUTH_SCOPES:-boards:read boards:write pins:read pins:write}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-automedia}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      STORAGE_SIGNED_URL_TTL: ${STORAGE_SIGNED_URL_TTL:-3600}
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET:-}
      RETENTION_METRICS_DAYS: ${RETENTION_METRICS_DAYS:-180}
      RETENTION_EXECUTIONS_DAYS: ${RETENTION_EXECUTIONS_DAYS:-180}
      RETENTION_JOBS_DAYS: ${RETENTION_JOBS_DAYS:-365}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-730}
      RETENTION_INVITATION_DAYS: ${RETENTION_INVITATION_DAYS:-30}
      N8N_API_KEY: ${N8N_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./media:/app/media

  postgres:
    image: postgres:16-alpine
    container_name: automedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automedia}
      POSTGRES_USER: ${POSTGRES_USER:-automedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automedia -d automedia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - automedia-postgres:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: automedia-n8n
    restart: unless-stopped
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
    volumes:
      - automedia-n8n:/home/node/.n8n
      - ./media:/app/media

  automedia-backup:
    image: postgres:16-alpine
    container_name: automedia-backup
    restart: unless-stopped
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-automedia}
      PGUSER: ${POSTGRES_USER:-automedia}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:-}
      BACKUP_MEDIA: ${BACKUP_MEDIA:-true}
      BACKUP_N8N: ${BACKUP_N8N:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./media:/media:ro
      - automedia-n8n:/n8n:ro
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          tmp="/backups/automedia-$${stamp}.sql.gz"
          pg_dump --no-owner --no-privileges | gzip > "$$tmp"
          if [ "$BACKUP_MEDIA" = "true" ]; then
            tar -czf "/backups/automedia-files-${stamp}.tgz" -C /media . 2>/dev/null || true
          fi
          if [ "$BACKUP_N8N" = "true" ]; then
            tar --exclude='*/cache/*' -czf "/backups/automedia-n8n-${stamp}.tgz" -C /n8n . 2>/dev/null || true
          fi
          sha256sum "$tmp" /backups/automedia-files-${stamp}.tgz /backups/automedia-n8n-${stamp}.tgz 2>/dev/null > "/backups/automedia-${stamp}.sha256" || true
          if [ -n "$BACKUP_ENCRYPTION_PASSWORD" ]; then
            for source in "$tmp" "/backups/automedia-files-${stamp}.tgz" "/backups/automedia-n8n-${stamp}.tgz"; do
              if [ -f "$source" ]; then
                openssl enc -aes-256-cbc -pbkdf2 -salt -in "$source" -out "${source}.enc" -pass env:BACKUP_ENCRYPTION_PASSWORD
                rm -f "$source"
              fi
            done
          fi
          find /backups -type f -mtime +"$BACKUP_RETENTION_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

volumes:
  automedia-postgres:
  automedia-n8n:
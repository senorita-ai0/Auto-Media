services:
  automedia:
    build: .
    container_name: automedia
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://automedia:automedia@postgres:5432/automedia
      N8N_ENABLED: "false"
      N8N_BASE_URL: http://n8n:5678
      N8N_SHARED_SECRET: change-me
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./media:/app/media

  postgres:
    image: postgres:16-alpine
    container_name: automedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: automedia
      POSTGRES_USER: automedia
      POSTGRES_PASSWORD: automedia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automedia -d automedia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - automedia-postgres:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: automedia-n8n
    restart: unless-stopped
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
    volumes:
      - automedia-n8n:/home/node/.n8n

volumes:
  automedia-postgres:
  automedia-n8n:
